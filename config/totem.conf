CONFIG_ZMK_USB_LOGGING=n
# Debounce: was 8/8 until 2026-09-08. ZMK's own default is 5/5 (the Kconfig
# symbols default to -1, which defers to the devicetree debounce-press-ms /
# debounce-release-ms properties, both 5), so 8/8 was 3 ms worse than stock on
# each edge for no reason anyone recorded.
#
# Press is now 1, which is what ZMK's docs recommend as the near-eager setting:
# "ZMK does not currently support true eager debouncing, but you can get
# something very close by setting the time to detect a key press to zero and
# the time to detect a key release to a larger number... Also consider setting
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1 instead, which adds one millisecond of
# latency but protects against short noise spikes."
#   -- zmk/docs/docs/features/debouncing.md at tag v0.3
#
# Release stays at 5: debouncing the release is what stops chatter, and a slow
# release costs nothing that is felt.
#
# If a key ever registers twice on one press, that switch is bouncing. Put
# PRESS_MS back to 5 first; if it persists the socket or switch is the fault.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Deep sleep: after 15 min of no key CHANGES the keyboard powers down its radio
# and clears RAM. A key held down (e.g. jammed in a bag) does NOT reset the idle
# timer, so this also protects against a stuck switch replaying state on reconnect.
# Requires `wakeup-source;` on kscan0 in boards/shields/totem/totem.dtsi,
# otherwise the only way to wake is the physical reset button on each half.
CONFIG_ZMK_SLEEP=y
