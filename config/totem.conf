CONFIG_ZMK_USB_LOGGING=n
# Debounce: 8/8 originally, cut to 1/5 on 2026-09-08, back to ZMK's stock 5/5
# on 2026-09-11 after keys started registering twice on a single press.
#
# 1 ms was too low for these switches. ZMK's docs offer it as the near-eager
# setting, but that only holds if the hardware is clean. 5/5 is ZMK's own
# default (the Kconfig symbols default to -1, deferring to the devicetree
# debounce-press-ms / debounce-release-ms properties, both 5).
#
# If keys STILL double at 5, the next step is back to 8/8 - and at that point
# the real fault is switch or socket wear on whichever keys double, not this
# number. Track which keys it is before raising it again.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Deep sleep: after 15 min of no key CHANGES the keyboard powers down its radio
# and clears RAM. A key held down (e.g. jammed in a bag) does NOT reset the idle
# timer, so this also protects against a stuck switch replaying state on reconnect.
# Requires `wakeup-source;` on kscan0 in boards/shields/totem/totem.dtsi,
# otherwise the only way to wake is the physical reset button on each half.
CONFIG_ZMK_SLEEP=y
