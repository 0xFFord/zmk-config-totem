name: Release firmware
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware
      - name: Rename UF2s with tag
        run: |
          cd firmware
          for f in *.uf2; do mv "$f" "${f%.uf2}-${GITHUB_REF_NAME}.uf2"; done
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" firmware/*.uf2
          --repo "$GITHUB_REPOSITORY"
          --title "Firmware $GITHUB_REF_NAME"
          --generate-notes
